services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ae-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9900:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ae_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: ae-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3000"
    volumes:
      - ae_grafana_data:/var/lib/grafana

volumes:
  ae_prometheus_data:
  ae_grafana_data:
